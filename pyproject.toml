[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "active-memory"
version = "0.1.0a0"
description = "Local, inspectable semantic memory and context assembly for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Venugopal Bhatia" }
]
keywords = ["llm", "context-window", "memory", "proxy", "claude", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = [
  "anthropic>=0.34.0",
]
openai = [
  "openai>=1.30.0",
]
gemini = [
  "google-genai>=1.0.0",
]
local = [
  "sentence-transformers>=3.0.0",
]
dev = [
  "anthropic>=0.34.0",
  "pytest>=8.0",
  "ruff>=0.9.0",
  "mypy>=1.13.0",
]

[project.scripts]
active-memory = "active_memory.cli:main"
active-memory-proxy = "active_memory.proxy:main"
active-memory-eval = "active_memory.evaluation.end_to_end:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["active_memory*"]

[tool.setuptools.package-data]
"active_memory.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
